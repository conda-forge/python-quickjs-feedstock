context:
  version: "1.19.4"

package:
  name: python-quickjs
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/quickjs/quickjs-${{ version }}.tar.gz
  sha256: 1205953abc24ff757f4a795304d5d61e4bf1e555c9ef6ec96a132d4b95535484
  patches:
    - setup.patch

build:
  number: 5

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - if: win
      then:
        - distutils-activate-mingw
    - pip
    - python
    - setuptools
  run:
    - python

tests:
  - python:
      imports:
        - quickjs
      pip_check: true
  - script: python -m unittest
    files:
      recipe:
        - test_quickjs.py

about:
  homepage: https://github.com/PetterS/quickjs
  summary: 'Wrapping the quickjs C library.'
  license: MIT
  license_file:
    - LICENSE
    - LICENSE-quickjs
  documentation: https://bellard.org/quickjs/
  repository: https://github.com/PetterS/quickjs

extra:
  recipe-maintainers:
    - m-rossi
    - fcollonval
